name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Setup Application
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
          npm ci
          npm run build

      - name: Run CI Checks
        run: composer ci:check

  mysql-migrations:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: hrms_test
          MYSQL_ROOT_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ptest_password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          tools: composer:v2
          coverage: none
      - name: Verify MySQL migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: hrms_test
          DB_USERNAME: root
          DB_PASSWORD: test_password
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
      - name: Test attendance, leave, scheduling and payroll on MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: hrms_test
          DB_USERNAME: root
          DB_PASSWORD: test_password
        run: php vendor/bin/phpunit -c phpunit.mysql.xml
      - name: Stress payroll with independent MySQL processes
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: hrms_test
          DB_USERNAME: root
          DB_PASSWORD: test_password
        run: php tests/Support/mysql_hardening.php
      - name: Measure fictional MySQL performance smoke
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: hrms_test
          DB_USERNAME: root
          DB_PASSWORD: test_password
        run: php tests/Support/mysql_performance.php
      - name: Rehearse fictional MySQL backup and restore
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: hrms_test
          DB_USERNAME: root
          DB_PASSWORD: test_password
        run: |
          set -euo pipefail
          php tests/Support/mysql_recovery_fingerprint.php > "$RUNNER_TEMP/hrms-source-fingerprint.json"
          container=$(docker ps --filter ancestor=mysql:8.4 --format '{{.ID}}' | head -n 1)
          test -n "$container"
          docker exec -e MYSQL_PWD=test_password "$container" mysqldump -u root --single-transaction --set-gtid-purged=OFF --no-tablespaces hrms_test > "$RUNNER_TEMP/hrms-fictional.sql"
          test -s "$RUNNER_TEMP/hrms-fictional.sql"
          docker exec -e MYSQL_PWD=test_password "$container" mysql -u root -e 'CREATE DATABASE hrms_restore_test'
          docker exec -i -e MYSQL_PWD=test_password "$container" mysql -u root hrms_restore_test < "$RUNNER_TEMP/hrms-fictional.sql"
          DB_DATABASE=hrms_restore_test php tests/Support/mysql_recovery_fingerprint.php > "$RUNNER_TEMP/hrms-restored-fingerprint.json"
          cmp "$RUNNER_TEMP/hrms-source-fingerprint.json" "$RUNNER_TEMP/hrms-restored-fingerprint.json"
          echo 'Fictional MySQL restore counts, row digests and selected references match.'
